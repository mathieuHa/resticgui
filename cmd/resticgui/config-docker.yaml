logs:
  debug: false
  level: 1

server:
  ip: "0.0.0.0"
  port: 3030

store:
  path: /opt/db/resticgui.sqlite
  key_file: /opt/db/resticgui.key
  legacy_path: /opt/db/resticgui.db

restic:
  bin: /usr/bin/restic

jobs:
  workers: 2
  schedule: true

paths:
  roots: []

auth:
  # set password_hash (resticgui hash-password), or put the container behind a login
  username: admin
  password_hash: ""

hooks:
  # allow command hooks, which run before and after backups with ResticGUI's
  # rights; webhooks need no setting. See https://resticgui.com/features/hooks
  commands: false

metrics:
  # serve Prometheus metrics at /metrics. See https://resticgui.com/features/metrics
  enabled: false
  # when set, scrapes must send "Authorization: Bearer <token>"
  token: ""
