name: Weekly rebuild

# Rebuilds the latest release and edge every Monday so that the images get
# Alpine's security fixes; the code they ship does not change.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.latest.outputs.tag }}
      version: ${{ steps.latest.outputs.version }}
    steps:
      - name: Latest release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          echo "latest release: ${tag:-none}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  release:
    needs: latest
    if: needs.latest.outputs.tag != ''
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    with:
      ref: ${{ needs.latest.outputs.tag }}
      version: ${{ needs.latest.outputs.version }}

  edge:
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    with:
      ref: main
