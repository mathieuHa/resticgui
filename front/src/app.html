<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" />
    <meta name="color-scheme" content="light dark" />
    <title>ResticGUI</title>
    <script>
      // apply the chosen theme before the first paint; no choice follows the system
      try {
        const theme = localStorage.getItem('resticgui-theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = 'resticgui-' + theme;
      } catch {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
