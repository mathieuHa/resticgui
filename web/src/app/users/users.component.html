<div class="card">
  <div class="card-header">
    Users
  </div>
  <div  class="card-body">
    <div class="card-body m-3">
      <ul *ngIf="users && users.length>0" class="list-group list-group-flush">
        <li class="list-group-item" *ngFor="let user of users" (click)="onSelect(user)">
          {{user.firstname}}
          <button style="float: right" class="btn btn-sm btn-danger m-1">
            <fa-icon [icon]="faTrash"></fa-icon>
          </button>

          <button style="float: right" class="btn btn-sm btn-warning m-1"
                  routerLink="/users/{{user.id}}/edit"
          >
            <fa-icon [icon]="faEdit"></fa-icon>
          </button>

          <button style="float: right" class="btn btn-sm btn-info m-1"
                  routerLink="/users/{{user.id}}"
            >
            <fa-icon [icon]="faEye"></fa-icon>
          </button>

        </li>
      </ul>
    </div>
    <div class="card-body m-3">
        <div *ngIf="users && users.length===0"  class="alert alert-info " role="alert"> No Users</div>
      <button  class="btn btn-primary" style="float: right">
        <fa-icon  [icon]="faPlus" (click)="addUser=!addUser"></fa-icon>
      </button>

    </div>
  </div>

</div>

<br>
<br>
<div *ngIf="addUser">
  <app-create-users></app-create-users>
</div>
