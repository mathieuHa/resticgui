<div *ngIf="user" class="card">
  <h5 class="card-header">Edit User</h5>
  <div class="card-body">
    <h5 class="card-title">User {{user.firstname}}</h5>
    <p class="card-text">
      <app-form-users (updateUserForm)="UpdateUser($event)" [user]="user"></app-form-users>    </p>
  </div>
</div>

<div class="alert alert-danger" *ngIf="!user">
  No user found with id
</div>
