<div *ngIf="user" class="card">
  <h5 class="card-header">Edit User</h5>
  <div class="card-body">
    <h5 class="card-title">User {{user.name}}</h5>
    <p class="card-text">
      <app-form-users></app-form-users>
    </p>
  </div>
  <div class="card-footer">
    <button style="float: right" class="btn btn-sm btn-primary m-1" (click)="goBack()">
      <fa-icon [icon]="faUndoAlt"></fa-icon>
    </button>
    <button (click)="save()"
            style="float: right" class="btn btn-sm btn-success m-1">
      <fa-icon [icon]="faSave"></fa-icon>
    </button>
  </div>
</div>

<div class="alert alert-danger" *ngIf="!user">
  No user found with id
</div>
