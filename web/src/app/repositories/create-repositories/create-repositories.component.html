<div *ngIf="repository" class="card">
  <h5 class="card-header">Create Repository</h5>
  <div class="card-body">
    <h5 class="card-title">Repository {{repository.name}}</h5>
    <p class="card-text">
      <app-form-repositories (updateRepositoryForm)="CreateRepository($event)" [repository]="repository"></app-form-repositories>
    </p>
  </div>
</div>
