<div *ngIf="repository" class="card">
  <h5 class="card-header">Edit Repository
    <button style="float: right" class="btn btn-sm btn-primary" (click)="goBack()">
      <fa-icon [icon]="faUndoAlt"></fa-icon>
    </button>
  </h5>
  <div class="card-body">
    <h5 class="card-title">Repository {{repository.name}}</h5>
    <p class="card-text">
      <app-form-repositories (updateRepositoryForm)="UpdateRepository($event)" [repository]="repository"></app-form-repositories>
    </p>
    <app-edit-schedules [repository]="repository"></app-edit-schedules>
  </div>
</div>


<div class="alert alert-danger" *ngIf="!repository">
  No repository found with id
</div>
