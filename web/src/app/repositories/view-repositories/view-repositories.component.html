<div *ngIf="repository" class="card">
  <h5 class="card-header">
    View User
    <button style="float: right" class="btn btn-sm btn-primary" (click)="goBack()">
      <fa-icon [icon]="faUndoAlt"></fa-icon>
    </button>
  </h5>
  <div class="card-body">
    <h5 class="card-title">User {{repository.name}}</h5>
    <p class="card-text">
      ID: {{repository.id}} <br>
      Name: {{repository.name}}
    </p>
  </div>

</div>

<div class="alert alert-danger" *ngIf="!repository">
  No repository found with id
</div>
