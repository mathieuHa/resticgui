<div *ngIf="repository && repository.Entities && repository.Entities.length > 0">
  <span *ngFor="let entity of repository.Entities">
    Path {{entity.path}}<br>
  </span>
</div>

<button *ngIf="repository" [routerLink]="['/repositories/',repository.id,'entities','edit']" class="btn btn-warning" style="float: right">
  <fa-icon  [icon]="faEdit" ></fa-icon>
</button>

<div *ngIf="repository && repository.Entities && repository.Entities.length === 0">
  <span class="alert-info alert m-1" role="alert">
    No Entities
  </span>
</div>
