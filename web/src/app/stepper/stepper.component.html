<!-- {{ repository|json}} -->
<mat-stepper [linear]="true" #stepper>
    <form [formGroup]="repositoryForm">

        <mat-step label="Name your repository" [stepControl]="repositoryForm.controls.name" >
            <mat-form-field appearance="fill">
                <mat-label>Name</mat-label>
                <input matInput formControlName="name" placeholder="Repository Name" required>
            </mat-form-field>
            <div>
                <button mat-button matStepperNext>Next</button>
            </div>
            
        </mat-step>
        <mat-step label="Fill the folder list to back up" [stepControl]="repositoryForm.controls.Entities" >
            <ng-container formArrayName="Entities">
                <ng-container *ngFor="let entityF of Entities.controls; let i = index">
                    <div [formGroupName]="i">
                        <mat-form-field appearance="fill">
                            <input matInput
                                formControlName="path"
                                placeholder="path">
                        </mat-form-field>
                        <mat-icon *ngIf="entityF.value.exists" aria-hidden="false" class="text-success" aria-label="Example check icon">check</mat-icon>
                        <!-- <mat-icon *ngIf="!entityF.value.exists" aria-hidden="false" class="text-danger" aria-label="Example error icon">error</mat-icon> -->
                        <mat-icon *ngIf="!entityF.value.exists" aria-hidden="false" class="text-warning" aria-label="Example sync_problem icon">sync_problem</mat-icon>
                        
                        <button mat-raised-button (click)="removeEntity(i)" class="m-1" color="warn">Delete</button>

                    <br>
                  </div>
                </ng-container>
            </ng-container>
                
            <button type="button"  (click)="addEntity()" mat-raised-button color="primary">Add</button>
            <div>
                <button mat-button matStepperPrevious>Back</button>
                <button mat-button matStepperNext>Next</button>
            </div>
        </mat-step>
        <mat-step label="Choose the frequency of the backup" [stepControl]="repositoryForm.controls.BackupSchedule">
            <ng-container formGroupName="BackupSchedule">
                <div *ngIf="repository && repository.Schedule">
                    <mat-tab-group backgroundColor="primary" mat-align-tabs="center" #selectedTab>
                      <mat-tab  label="Cron Syntax">
                        <ng-container [ngTemplateOutlet]='Cron'></ng-container>
                      </mat-tab>
                      <mat-tab label="Interval">
                        <ng-container [ngTemplateOutlet]='Interval'></ng-container>
                      </mat-tab>
                      <mat-tab  label="Regular">
                        <ng-container [ngTemplateOutlet]='Regular'></ng-container>
                      </mat-tab>
                      <mat-tab  label="Weekly">
                        <ng-container [ngTemplateOutlet]='Weekly'></ng-container>
                      </mat-tab>
                    </mat-tab-group>
                </div>
                <ng-template #Cron>
                    <div class="col-auto">
                      <label for="cron" class="col-form-label">Cron</label>
                    </div>
                    <div class="col-auto">
                        <mat-form-field appearance="fill">
                            <mat-label>Cron</mat-label>
                            <input matInput formControlName="cron_syntax" placeholder="*/30 * * * *">
                        </mat-form-field>
                      <!-- <input [disabled]="disabled"
                             [(ngModel)]="repository.Schedule.cron_syntax"
                             #cron="ngModel"
                             required
                             pattern="[\s\/\*:0-9]{9,30}"
                             placeholder="*/30 * * * *" type="text" id="cron" class="form-control" aria-describedby="cronHelp"> -->
                    </div>
              
                </ng-template>
              
                <ng-template #Interval>
                    <div class="col-3">
                      <label for="interval" class="col-form-label">Interval</label>
                    </div>
                    <div class="col-9">
                        <mat-form-field appearance="fill">
                            <mat-label>Interval</mat-label>
                            <input matInput formControlName="interval" placeholder="1h30">
                        </mat-form-field>
                      <!-- <input [disabled]="disabled"
                             [(ngModel)]="repository.Schedule.interval"
                             #interval="ngModel"
                             required
                             pattern="[:0-9]{4,5}"
                             placeholder="1h30" type="text" id="interval" class="form-control" aria-describedby="intervalHelp"> -->
                    </div>
                </ng-template>
              
                <ng-template #Regular>
                  Regular Settings<br>
                  <mat-grid-list cols="2" rowHeight="100px">
                    <mat-grid-tile>
                      <div class="text-inside-grid">
                      <div class="form-check form-switch">
                        <mat-slide-toggle formControlName="every_day">Every Day</mat-slide-toggle>
                        <!-- <input class="form-check-input"
                               [disabled]="disabled"
                               [(ngModel)]="repository.Schedule.every_day"
                               (ngModelChange)="updateRegularSetting('day')"
                               type="checkbox" id="EveryDay">
                        <label class="form-check-label" for="EveryDay">Every Day</label> -->
                      </div>
                      <div class="form-check form-switch">
                        <mat-slide-toggle formControlName="every_week">Every Day</mat-slide-toggle>
                        <!-- <input class="form-check-input"
                               [disabled]="disabled"
                               [(ngModel)]="repository.Schedule.every_week"
                               (ngModelChange)="updateRegularSetting('week')"
                               type="checkbox" id="EveryWeek">
                        <label class="form-check-label" for="EveryWeek">Every Week</label> -->
                      </div>
                      <div class="form-check form-switch">
                        <mat-slide-toggle formControlName="every_month">Every Month</mat-slide-toggle>
                        <!-- <input class="form-check-input"
                               [disabled]="disabled"
                               [(ngModel)]="repository.Schedule.every_month"
                               (ngModelChange)="updateRegularSetting('month')"
                               type="checkbox" id="EveryMonth">
                        <label class="form-check-label" for="EveryMonth">Every Month</label> -->
                      </div>
                      </div>
                    </mat-grid-tile>
                    <mat-grid-tile>
                      <div>
                        <!-- <div class="col-auto">
                          <label for="regular_hour" class="col-form-label">Hour</label>
                        </div>
                        <div class="col-auto">
                          <input [disabled]="disabled"
                                 #regular_hour="ngModel"
                                 required
                                 pattern="[:0-9]{4,5}"
                                 [(ngModel)]="repository.Schedule.hour"
                                 placeholder="01:03" type="text" id="regular_hour" class="form-control">
                        </div> -->
                        <mat-form-field appearance="fill">
                            <mat-label>Hour</mat-label>
                            <input matInput formControlName="regular_hour" placeholder="01:03">
                        </mat-form-field>
                      </div>
                      <!-- <div *ngIf="repository!.BackupSchedule.every_week"> TOKEEP
                        <mat-form-field appearance="fill">
                          <mat-label>Day of Week</mat-label>
                          <mat-select [formControl]="day">
                            <mat-option *ngFor="let day of weekDays" [value]="day.value">
                              {{day.viewValue}}
                            </mat-option>
                          </mat-select>
                        </mat-form-field> 
                      </div>-->
                  <!-- <div *ngIf="repository.Schedule.every_month"> TOKEEP
                    <mat-form-field appearance="fill">
                      <mat-label>Day of Month</mat-label>
                      <mat-select [(value)]="repository.Schedule.day">
                        <mat-option *ngFor="let day of monthDays" [value]="day">
                          {{day}}
                        </mat-option>
                      </mat-select>
                    </mat-form-field>
                  </div> -->
                  </mat-grid-tile>
                  </mat-grid-list>
              
              
                </ng-template>
              
                <ng-template #Weekly>
              
                  Weekly Settings<br>
                  <mat-grid-list cols="2" rowHeight="200px">
                    <mat-grid-tile>
                      <div class="text-inside-grid">
                        <div class="form-check form-switch">
                            <mat-slide-toggle formControlName="every_monday">Every Monday</mat-slide-toggle>

                          <!-- <input class="form-check-input"
                                 [disabled]="disabled"
                                 [(ngModel)]="repository.Schedule.every_monday" type="checkbox" id="EveryMonday">
                          <label class="form-check-label" for="EveryMonday">Every Monday</label> -->
                        </div>
                        <div class="form-check form-switch">
                            <mat-slide-toggle formControlName="every_tuesday">Every Tuesday</mat-slide-toggle>

                            <!-- <input class="form-check-input"
                                    [disabled]="disabled"
                                    [(ngModel)]="repository.Schedule.every_tuesday" type="checkbox" id="EveryTuesday">
                            <label class="form-check-label" for="EveryTuesday">Every Tuesday</label> -->
                        </div>
                        <div class="form-check form-switch">
                            <mat-slide-toggle formControlName="every_wednesday">Every Wednesday</mat-slide-toggle>

                          <!-- <input class="form-check-input"
                                 [disabled]="disabled"
                                 [(ngModel)]="repository.Schedule.every_wednesday" type="checkbox" id="EveryWednesday">
                          <label class="form-check-label" for="EveryWednesday">Every Wednesday</label> -->
                        </div>
                        <div class="form-check form-switch">
                            <mat-slide-toggle formControlName="every_thursday">Every Thursday</mat-slide-toggle>

                          <!-- <input class="form-check-input"
                                 [disabled]="disabled"
                                 [(ngModel)]="repository.Schedule.every_thursday" type="checkbox" id="EveryThursday">
                          <label class="form-check-label" for="EveryThursday">Every Month</label> -->
                        </div>
                        <div class="form-check form-switch">
                            <mat-slide-toggle formControlName="every_friday">Every Friday</mat-slide-toggle>

                          <!-- <input class="form-check-input"
                                 [disabled]="disabled"
                                 [(ngModel)]="repository.Schedule.every_friday" type="checkbox" id="EveryFriday">
                          <label class="form-check-label" for="EveryFriday">Every Friday</label> -->
                        </div>
                        <div class="form-check form-switch">
                            <mat-slide-toggle formControlName="every_saturday">Every Saturday</mat-slide-toggle>

                          <!-- <input class="form-check-input"
                                 [disabled]="disabled"
                                 [(ngModel)]="repository.Schedule.every_saturday" type="checkbox" id="EverySaturday">
                          <label class="form-check-label" for="EverySaturday">Every Saturday</label> -->
                        </div>
                        <div class="form-check form-switch">
                            <mat-slide-toggle formControlName="every_sunday">Every Sunday</mat-slide-toggle>

                          <!-- <input class="form-check-input"
                                 [disabled]="disabled"
                                 [(ngModel)]="repository.Schedule.every_sunday" type="checkbox" id="EverySunday">
                          <label class="form-check-label" for="EverySunday">Every Sunday</label> -->
                        </div>
                      </div>
                    </mat-grid-tile>
                    <mat-grid-tile>
                        <mat-form-field appearance="fill">
                            <mat-label>Hour</mat-label>
                            <input matInput formControlName="week_hour" placeholder="01:03">
                        </mat-form-field>
                          <!-- <label for="week_hour" class="col-form-label m-1">Hour</label>
                          <input
                                 pattern="[:0-9]{4,5}"
                                 #week_hour="ngModel"
                                 [(ngModel)]="repository.Schedule.hour"
                                 required
                                 placeholder="01:03" type="text" id="week_hour" class="form-control"> -->
                    </mat-grid-tile>
                  </mat-grid-list>
                </ng-template>
                <br>
                <div class="d-grid gap-2">
            </div>
            </ng-container>
            <div>
                <button mat-button matStepperPrevious>Back</button>
                <button mat-button matStepperNext>Next</button>
            </div>
        </mat-step>

        <mat-step label="Save" [stepControl]="repositoryForm.controls.Active">
            <mat-slide-toggle formControlName="Active" >Enable the backup</mat-slide-toggle>
            <div>
                <button mat-button matStepperPrevious>Back</button>
                <button mat-raised-button color="primary" (click)="submit()">Submit</button>
            </div>
        </mat-step>
    </form>
</mat-stepper>
