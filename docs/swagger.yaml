info:
  contact: {}
paths:
  /paths:
    post:
      consumes:
      - application/json
      description: returns files and directories for the provided path
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: get path info
  /paths/all:
    post:
      consumes:
      - application/json
      description: returns files and directories recursively starting from the provided
        path
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: get recursive path info
swagger: "2.0"
