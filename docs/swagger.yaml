info:
  contact: {}
paths:
  /cmd:
    get:
      consumes:
      - application/json
      description: execute a restic cmd passed by queryParam
      parameters:
      - description: cmd
        enum:
        - version
        - help
        in: query
        name: cmd
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: execute restic cmd
  /paths:
    post:
      consumes:
      - application/json
      description: returns files and directories for the provided path
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: get path info
  /paths/all:
    post:
      consumes:
      - application/json
      description: returns files and directories recursively starting from the provided
        path
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: get recursive path info
  /repositories:
    get:
      consumes:
      - application/json
      description: returns all respositories
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/ent.Repository'
            type: array
      summary: get all repositories
    post:
      consumes:
      - application/json
      description: create a repository
      parameters:
      - description: Add account
        in: body
        name: repository
        required: true
        schema:
          $ref: '#/definitions/ent.Repository'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/ent.Repository'
        "400":
          description: Bad Request
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: create repository
  /repositories/{id}:
    delete:
      consumes:
      - application/json
      description: delete a repository by ID
      parameters:
      - description: Repository ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: ""
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: delete repository
    get:
      consumes:
      - application/json
      description: returns a respository filtered by his ID
      parameters:
      - description: Repository ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ent.Repository'
        "404":
          description: Not Found
          schema:
            type: string
      summary: get repository
    patch:
      consumes:
      - application/json
      description: edit a repository by ID
      parameters:
      - description: Repository ID
        in: path
        name: id
        required: true
        type: integer
      - description: Edit account
        in: body
        name: repository
        required: true
        schema:
          $ref: '#/definitions/ent.Repository'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ent.Repository'
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      summary: edit repository
  /repositories/{id}/logs:
    get:
      consumes:
      - application/json
      description: return the check command output for the repository
      parameters:
      - description: Repository ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: ""
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Check repository
  /repositories/{id}/provider/valid:
    get:
      consumes:
      - application/json
      description: valid the repository by ID
      parameters:
      - description: Repository ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: ""
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: valid provider of the repository
  /repositories/{id}/snapshots:
    get:
      consumes:
      - application/json
      description: return the snapshots command output for the repository
      parameters:
      - description: Repository ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: ""
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: get snapshots repository
  /repositories/{id}/valid:
    get:
      consumes:
      - application/json
      description: valid the repository by ID
      parameters:
      - description: Repository ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: ""
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: valid repository
swagger: "2.0"
