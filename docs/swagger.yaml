    type: object
info:
  contact: {}
paths:
  /paths:
    post:
      consumes:
      - application/json
      description: returns files and directories for the provided path
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: get path info
  /paths/all:
    post:
      consumes:
      - application/json
      description: returns files and directories recursively starting from the provided
        path
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: get recursive path info
  /repositories:
    get:
      consumes:
      - application/json
      description: returns all respositories
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/Models.Repository'
            type: array
      summary: get all repositories
    post:
      consumes:
      - application/json
      description: create a repository
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/Models.Repository'
        "400":
          description: Bad Request
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: create repository
  /repositories/{id}:
    delete:
      consumes:
      - application/json
      description: delete a repository by ID
      parameters:
      - description: Repository ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: delete repository
    get:
      consumes:
      - application/json
      description: returns a respository filtered by his ID
      parameters:
      - description: Repository ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Models.Repository'
        "404":
          description: Not Found
          schema:
            type: string
      summary: get repository
    patch:
      consumes:
      - application/json
      description: edit a repository by ID
      parameters:
      - description: Repository ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Models.Repository'
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      summary: edit repository
swagger: "2.0"
