# ResticGUI on Kubernetes: one replica (it keeps its state in SQLite),
# its database on a PersistentVolumeClaim, the encryption key in a Secret.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: resticgui-db
  labels: {app.kubernetes.io/name: resticgui}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resticgui
  labels: {app.kubernetes.io/name: resticgui}
spec:
  replicas: 1
  # never two pods on one database
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: resticgui}
  template:
    metadata:
      labels: {app.kubernetes.io/name: resticgui}
    spec:
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: resticgui
          image: ghcr.io/mathieuha/resticgui:latest
          # root, to read the files of every volume it backs up and restore
          # them with their owners, but with only those rights
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, DAC_READ_SEARCH, FOWNER, FSETID]
          ports:
            - {name: http, containerPort: 3030}
          env:
            - name: RESTICGUI_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: resticgui-key, key: key}
            - {name: RESTIC_CACHE_DIR, value: /opt/db/cache}
            # schedules follow this time zone
            - {name: TZ, value: UTC}
          volumeMounts:
            - {name: db, mountPath: /opt/db}
            - {name: config, mountPath: /opt/config.yaml, subPath: config.yaml, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            # what to back up, for example a volume of another application:
            # - {name: data, mountPath: /backup/data, readOnly: true}
          readinessProbe:
            httpGet: {path: /api/v2/version, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/v2/version, port: http}
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 1Gi}
      volumes:
        - name: db
          persistentVolumeClaim: {claimName: resticgui-db}
        - name: config
          configMap: {name: resticgui-config}
        - name: tmp
          emptyDir: {}
        # - name: data
        #   persistentVolumeClaim: {claimName: my-app-data}
---
apiVersion: v1
kind: Service
metadata:
  name: resticgui
  labels: {app.kubernetes.io/name: resticgui}
spec:
  selector: {app.kubernetes.io/name: resticgui}
  ports:
    - {name: http, port: 80, targetPort: http}
---
# Nothing in the cluster may connect to ResticGUI: reach it with
# kubectl port-forward, or allow your ingress controller (see ingress.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: resticgui
  labels: {app.kubernetes.io/name: resticgui}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: resticgui}
  policyTypes: [Ingress]
  ingress: []
