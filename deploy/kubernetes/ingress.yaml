# Optional: ResticGUI behind an Ingress, with TLS. Set auth.password_hash
# in config.yaml first. Add it to the resources of kustomization.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resticgui
  labels: {app.kubernetes.io/name: resticgui}
  annotations:
    # live progress is a server-sent event stream: no buffering
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  rules:
    - host: backup.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: resticgui, port: {name: http}}
  tls:
    - hosts: [backup.example.com]
      secretName: resticgui-tls
---
# lets the ingress controller through the NetworkPolicy of resticgui.yaml;
# change the namespace to your controller's
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: resticgui-from-ingress
  labels: {app.kubernetes.io/name: resticgui}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: resticgui}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
      ports:
        - {port: http}
