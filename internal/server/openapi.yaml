openapi: 3.1.0
info:
  title: ResticGUI API
  version: "2.0"
  description: |
    Configure restic repositories, run backups and other jobs, follow their
    progress and browse or restore snapshots.

    When a password is configured, every endpoint except /auth/* and
    /openapi.yaml needs the session cookie set by POST /auth/login.
    Secrets (the repository password and secret variables) can be written
    but are never returned.

    Requests that change something must send JSON (Content-Type:
    application/json) and are refused when the browser says they come from
    another site (Sec-Fetch-Site or Origin). Without a password, only IP
    addresses, localhost and the names in server.allowed_hosts are answered
    (421 otherwise).
servers:
  - url: /api/v2
security:
  - session: []

paths:
  /openapi.yaml:
    get:
      summary: This document
      security: []
      responses:
        "200": { description: The OpenAPI document, content: { application/yaml: {} } }

  /auth/login:
    post:
      summary: Log in and receive the session cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "204": { description: Logged in; the session cookie is set }
        "401": { $ref: "#/components/responses/Error" }
        "429": { description: Too many failed logins from this client; wait for Retry-After seconds }
  /auth/logout:
    post:
      summary: End the session on the server and clear its cookie
      security: []
      responses:
        "204": { description: Logged out }
  /auth/session:
    get:
      summary: Whether a login is required and whether this client has one
      security: []
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                type: object
                required: [auth_enabled, authenticated]
                properties:
                  auth_enabled: { type: boolean }
                  authenticated: { type: boolean }
                  username: { type: string }

  /version:
    get:
      summary: The ResticGUI version
      security: []
      responses:
        "200":
          description: Version, "dev" for a build that is not a release
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version: { type: string, examples: ["0.2.0"] }

  /backends:
    get:
      summary: Supported backends and the variables each reads
      responses:
        "200":
          description: Backends
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Backend" } }

  /settings:
    get:
      summary: Optional features the configuration turns on
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                type: object
                required: [hook_commands, metrics]
                properties:
                  hook_commands: { type: boolean, description: Command hooks are allowed (hooks.commands) }
                  metrics: { type: boolean, description: Prometheus metrics are served at /metrics (metrics.enabled) }

  /notifiers:
    get:
      summary: List the notifiers
      description: Notifiers alert about every repository. Their URLs are never returned.
      responses:
        "200":
          description: Notifiers
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Notifier" } }
    post:
      summary: Add a notifier
      requestBody: { $ref: "#/components/requestBodies/NotifierInput" }
      responses:
        "201": { $ref: "#/components/responses/Notifier" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /notifiers/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    put:
      summary: Change a notifier
      description: An empty url keeps the current one.
      requestBody: { $ref: "#/components/requestBodies/NotifierInput" }
      responses:
        "200": { $ref: "#/components/responses/Notifier" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      summary: Remove a notifier
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }

  /notifiers/{id}/test:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      summary: Send a test message
      responses:
        "204": { description: Sent }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /fs:
    get:
      summary: List a local directory inside the allowed roots
      description: Without a path, lists the allowed roots.
      parameters:
        - { name: path, in: query, schema: { type: string } }
      responses:
        "200":
          description: Entries, directories first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Entry" } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /repositories:
    get:
      summary: List repositories
      responses:
        "200":
          description: Repositories
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Repository" } }
    post:
      summary: Create a repository
      description: This records the repository; run an init job to create it in restic when it is new.
      requestBody: { $ref: "#/components/requestBodies/RepositoryInput" }
      responses:
        "201": { $ref: "#/components/responses/Repository" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /repositories/probe:
    post:
      summary: Look at a repository location before adding it
      description: Says whether a restic repository exists there and opens with the password, and lists its newest snapshot. Nothing is saved.
      requestBody: { $ref: "#/components/requestBodies/RepositoryInput" }
      responses:
        "200":
          description: What is there
          content:
            application/json:
              schema:
                type: object
                required: [exists, snapshots, latest]
                properties:
                  exists: { type: boolean }
                  snapshots: { type: integer, description: Every snapshot, also those made outside ResticGUI }
                  latest: { oneOf: [{ $ref: "#/components/schemas/Snapshot" }, { type: "null" }] }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /repositories/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      summary: Get a repository
      responses:
        "200": { $ref: "#/components/responses/Repository" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Replace a repository's settings
      description: An empty password keeps the current one; omitting secrets keeps them.
      requestBody: { $ref: "#/components/requestBodies/RepositoryInput" }
      responses:
        "200": { $ref: "#/components/responses/Repository" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      summary: Forget a repository in resticgui
      description: The restic repository and its snapshots are left untouched.
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /repositories/{id}/plans:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      summary: Add a backup plan
      description: A plan says what to back up into the repository, how, when and how long to keep it. A repository has as many as needed, deduplicated together.
      requestBody: { $ref: "#/components/requestBodies/PlanInput" }
      responses:
        "201": { $ref: "#/components/responses/Plan" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /repositories/{id}/plans/{plan}:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { $ref: "#/components/parameters/plan" }
    put:
      summary: Replace a plan
      description: Everything is replaced but the plan's tag, so its retention goes on applying to the snapshots it made.
      requestBody: { $ref: "#/components/requestBodies/PlanInput" }
      responses:
        "200": { $ref: "#/components/responses/Plan" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a plan
      description: Its snapshots stay in the repository.
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /repositories/{id}/plans/{plan}/retention/preview:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { $ref: "#/components/parameters/plan" }
    post:
      summary: Show what a retention policy would keep and remove
      description: Runs restic forget --dry-run on the snapshots a forget job of the plan would consider. The policy need not be saved.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Retention" }
      responses:
        "200":
          description: Snapshots kept and removed, newest first
          content:
            application/json:
              schema:
                type: object
                required: [keep, remove]
                properties:
                  keep:
                    type: array
                    items:
                      allOf:
                        - { $ref: "#/components/schemas/Snapshot" }
                        - type: object
                          properties:
                            matches: { type: array, items: { type: string }, description: The rules that keep it }
                  remove: { type: array, items: { $ref: "#/components/schemas/Snapshot" } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /repositories/{id}/schedules/{job}:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: job, in: path, required: true, schema: { type: string, enum: [check] } }
    put:
      summary: Set when the integrity check runs
      description: Backups and retention are scheduled in plans.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cron]
              properties:
                cron: { type: string, description: 'Five cron fields or a descriptor such as "@daily" or "@every 6h"', example: "30 2 * * *" }
                enabled: { type: boolean, default: true }
      responses:
        "200": { $ref: "#/components/responses/Repository" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Remove a schedule
      responses:
        "200": { $ref: "#/components/responses/Repository" }
        "404": { $ref: "#/components/responses/Error" }

  /repositories/{id}/healthcheck:
    parameters: [{ $ref: "#/components/parameters/id" }]
    put:
      summary: Ping a Healthchecks check on every backup
      description: The URL is pinged with /start, then itself or /fail. It is never returned, only its host.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri, writeOnly: true, example: "https://hc-ping.com/your-uuid" }
      responses:
        "200": { $ref: "#/components/responses/Repository" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Stop pinging Healthchecks
      responses:
        "200": { $ref: "#/components/responses/Repository" }

  /repositories/{id}/hooks:
    parameters: [{ $ref: "#/components/parameters/id" }]
    put:
      summary: Replace the hooks run around backups
      description: Hooks of one event run in the order given. A webhook sent back with its id and no url keeps its URL.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: array, items: { $ref: "#/components/schemas/HookInput" } }
      responses:
        "200": { $ref: "#/components/responses/Repository" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /repositories/{id}/jobs:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      summary: Start a job now
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [init, backup, forget, prune, check, unlock] }
                plan_id: { type: integer, description: The plan a backup or forget runs; it can be left out when the repository has one plan }
      responses:
        "202": { $ref: "#/components/responses/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /repositories/{id}/backup:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      summary: Back up now
      description: Backs up the repository's only plan; a repository with several needs POST /repositories/{id}/jobs with a plan_id.
      responses:
        "202": { $ref: "#/components/responses/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /repositories/{id}/stats:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      summary: Repository or snapshot statistics
      parameters:
        - { name: mode, in: query, schema: { type: string, enum: [restore-size, files-by-contents, raw-data, blobs-per-file], default: restore-size } }
        - { name: snapshot, in: query, schema: { type: string } }
      responses:
        "200":
          description: Statistics
          content: { application/json: { schema: { $ref: "#/components/schemas/Stats" } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /repositories/{id}/snapshots:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      summary: List snapshots, oldest first
      parameters:
        - { name: all, in: query, description: Also snapshots made outside resticgui, schema: { type: boolean } }
      responses:
        "200":
          description: Snapshots
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Snapshot" } }
        "409": { $ref: "#/components/responses/Error" }

  /repositories/{id}/snapshots/{snapshot}:
    parameters: [{ $ref: "#/components/parameters/id" }, { $ref: "#/components/parameters/snapshot" }]
    delete:
      summary: Forget one snapshot
      parameters:
        - { name: prune, in: query, schema: { type: boolean } }
      responses:
        "204": { description: Forgotten }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /repositories/{id}/snapshots/{snapshot}/files:
    parameters: [{ $ref: "#/components/parameters/id" }, { $ref: "#/components/parameters/snapshot" }]
    get:
      summary: List a directory of a snapshot
      parameters:
        - { name: path, in: query, schema: { type: string, default: / } }
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Node" } }
        "400": { $ref: "#/components/responses/Error" }

  /repositories/{id}/snapshots/{snapshot}/find:
    parameters: [{ $ref: "#/components/parameters/id" }, { $ref: "#/components/parameters/snapshot" }]
    get:
      summary: Find files by name in a snapshot
      parameters:
        - { name: pattern, in: query, required: true, schema: { type: string, example: "*.jpg" } }
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/FindMatch" } }
        "400": { $ref: "#/components/responses/Error" }

  /repositories/{id}/snapshots/{snapshot}/download:
    parameters: [{ $ref: "#/components/parameters/id" }, { $ref: "#/components/parameters/snapshot" }]
    get:
      summary: Download a file, or a directory as an archive
      parameters:
        - { name: path, in: query, schema: { type: string, default: / } }
        - { name: archive, in: query, schema: { type: string, enum: [zip, tar, none], default: zip } }
      responses:
        "200": { description: The file or archive, content: { application/octet-stream: {} } }
        "400": { $ref: "#/components/responses/Error" }

  /repositories/{id}/snapshots/{snapshot}/diff:
    parameters: [{ $ref: "#/components/parameters/id" }, { $ref: "#/components/parameters/snapshot" }]
    get:
      summary: What changed from this snapshot to another
      parameters:
        - { name: to, in: query, required: true, schema: { type: string, pattern: "^([0-9a-f]{8,64}|latest)$" } }
      responses:
        "200":
          description: The changes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Diff" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /repositories/{id}/snapshots/{snapshot}/restore:
    parameters: [{ $ref: "#/components/parameters/id" }, { $ref: "#/components/parameters/snapshot" }]
    post:
      summary: Restore a snapshot, as a job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target: { type: string, description: A local directory inside the allowed roots }
                include: { type: array, items: { type: string }, description: Paths inside the snapshot to restore; all when empty }
      responses:
        "202": { $ref: "#/components/responses/Job" }
        "400": { $ref: "#/components/responses/Error" }

  /jobs:
    get:
      summary: Jobs of a repository, newest first
      parameters:
        - { name: repository, in: query, required: true, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Jobs
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Job" } }
        "400": { $ref: "#/components/responses/Error" }
  /jobs/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      summary: Get a job
      responses:
        "200": { $ref: "#/components/responses/Job" }
        "404": { $ref: "#/components/responses/Error" }
  /jobs/{id}/cancel:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      summary: Cancel a queued or running job
      responses:
        "202": { description: Cancelling; the job ends as cancelled }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /events:
    get:
      summary: Server-Sent Events for job status and progress
      description: |
        Event "job" carries a status change, event "progress" the progress of a
        running backup or restore. Both have an Event as data. A client too slow
        to keep up is disconnected and should reload the jobs it shows.
      responses:
        "200":
          description: The event stream
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/Event" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: resticgui_session

  parameters:
    id: { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    plan: { name: plan, in: path, required: true, schema: { type: integer, minimum: 1 } }
    snapshot:
      name: snapshot
      in: path
      required: true
      description: A snapshot ID (8 to 64 hex characters) or "latest"
      schema: { type: string, pattern: "^([0-9a-f]{8,64}|latest)$" }

  requestBodies:
    RepositoryInput:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RepositoryInput" }

    PlanInput:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlanInput" }

    NotifierInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name: { type: string }
              url: { type: string, writeOnly: true, description: 'A Shoutrrr URL, required on create; empty keeps it', example: "ntfy://ntfy.sh/my-backups" }
              on_failure: { type: boolean }
              on_success: { type: boolean }
              on_missed: { type: boolean }
              enabled: { type: boolean }

  responses:
    Error:
      description: An error
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }
              details: { type: array, items: { type: string }, description: One line per validation problem }
    Repository:
      description: The repository
      content: { application/json: { schema: { $ref: "#/components/schemas/Repository" } } }
    Plan:
      description: The plan
      content: { application/json: { schema: { $ref: "#/components/schemas/Plan" } } }
    Job:
      description: The job
      content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } }
    Notifier:
      description: The notifier
      content: { application/json: { schema: { $ref: "#/components/schemas/Notifier" } } }

  schemas:
    Backend:
      type: object
      required: [name, prefix, example, env, secrets, required]
      properties:
        name: { type: string, enum: [azure, b2, gs, local, rclone, rest, s3, sftp] }
        prefix: { type: string, example: "s3:" }
        example: { type: string }
        env: { type: array, items: { type: string } }
        secrets: { type: array, items: { type: string } }
        required: { type: array, items: { type: string } }
    RepositoryInput:
      type: object
      required: [name, backend, location]
      properties:
        name: { type: string }
        backend: { type: string, enum: [azure, b2, gs, local, rclone, rest, s3, sftp] }
        location: { type: string, example: "s3:https://s3.eu-west-3.amazonaws.com/bucket/photos" }
        password: { type: string, format: password, writeOnly: true, description: Required on create }
        env: { type: object, additionalProperties: { type: string } }
        secrets: { type: object, additionalProperties: { type: string }, writeOnly: true }
        cacert: { type: string }
        extended: { type: object, additionalProperties: { type: string }, description: 'restic -o options, such as s3.storage-class' }
        host: { type: string }
    Repository:
      type: object
      required: [id, name, backend, location, env, secrets, has_password, extended, host, initialized_at, created_at, updated_at, plans, schedules, healthcheck, hooks]
      properties:
        id: { type: integer }
        name: { type: string }
        backend: { type: string }
        location: { type: string }
        env: { type: object, additionalProperties: { type: string } }
        secrets: { type: array, items: { type: string }, description: Names of the secret variables that are set }
        has_password: { type: boolean }
        cacert: { type: string }
        extended: { type: object, additionalProperties: { type: string } }
        host: { type: string }
        initialized_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        plans: { type: array, items: { $ref: "#/components/schemas/Plan" }, description: What is backed up, in the order the plans were made }
        schedules: { type: array, items: { $ref: "#/components/schemas/Schedule" }, description: The integrity check's schedule }
        healthcheck:
          description: The Healthchecks check pinged by backups; null when unset
          oneOf:
            - type: object
              required: [host]
              properties:
                host: { type: string }
            - type: "null"
        hooks: { type: array, items: { $ref: "#/components/schemas/Hook" }, description: Run around backups, before hooks first }
    Hook:
      type: object
      required: [id, event, kind, command, host, timeout_seconds]
      properties:
        id: { type: integer }
        event: { type: string, enum: [before, success, failure] }
        kind: { type: string, enum: [command, webhook] }
        command: { type: string, description: The shell command; empty for a webhook }
        host: { type: string, description: The webhook's host, as its URL is not returned; empty for a command }
        timeout_seconds: { type: integer }
    HookInput:
      type: object
      required: [event, kind]
      properties:
        id: { type: integer, description: An existing webhook whose URL to keep when url is empty }
        event: { type: string, enum: [before, success, failure] }
        kind: { type: string, enum: [command, webhook] }
        command: { type: string }
        url: { type: string, writeOnly: true }
        timeout_seconds: { type: integer, minimum: 1, maximum: 86400, default: 300 }
    Notifier:
      type: object
      required: [id, name, service, on_failure, on_success, on_missed, enabled, created_at]
      properties:
        id: { type: integer }
        name: { type: string }
        service: { type: string, description: The URL scheme, such as ntfy or discord }
        on_failure: { type: boolean }
        on_success: { type: boolean }
        on_missed: { type: boolean, description: A scheduled backup more than an hour late }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
    Diff:
      type: object
      required: [changes, stats]
      properties:
        changes:
          type: array
          items:
            type: object
            required: [path, modifier]
            properties:
              path: { type: string, description: Directories end with / }
              modifier: { type: string, enum: ["+", "-", M, T, U], description: 'Added, removed, content changed, type changed, metadata changed' }
        stats:
          type: object
          required: [changed_files, added, removed]
          properties:
            source_snapshot: { type: string }
            target_snapshot: { type: string }
            changed_files: { type: integer }
            added: { $ref: "#/components/schemas/DiffCount" }
            removed: { $ref: "#/components/schemas/DiffCount" }
    DiffCount:
      type: object
      required: [files, dirs, bytes]
      properties:
        files: { type: integer }
        dirs: { type: integer }
        bytes: { type: integer }
    Schedule:
      type: object
      required: [job, cron, enabled, next_run]
      properties:
        job: { type: string, enum: [backup, forget, check] }
        cron: { type: string }
        enabled: { type: boolean }
        next_run: { type: [string, "null"], format: date-time, description: When it runs next; null when disabled }
    ScheduleInput:
      type: object
      required: [job, cron]
      properties:
        job: { type: string, enum: [backup, forget] }
        cron: { type: string, description: 'Five cron fields or a descriptor such as "@daily" or "@every 6h"', example: "30 2 * * *" }
        enabled: { type: boolean, default: true }
    PlanOptions:
      type: object
      required: [compression, exclude_larger_than, one_file_system, exclude_caches, exclude_if_present, limit_upload, limit_download]
      properties:
        compression: { type: string, enum: [auto, off, max], default: auto }
        exclude_larger_than: { type: string, example: 2G, description: Skip files above this size; empty for none }
        one_file_system: { type: boolean, description: Stay on the file system of each path }
        exclude_caches: { type: boolean, description: Skip folders holding a CACHEDIR.TAG file }
        exclude_if_present: { type: array, items: { type: string }, description: Skip folders holding a file of one of these names, example: [".nobackup"] }
        limit_upload: { type: integer, minimum: 0, description: KiB/s; 0 for no limit }
        limit_download: { type: integer, minimum: 0, description: KiB/s; 0 for no limit }
    Plan:
      type: object
      required: [id, name, tag, tags, paths, options, schedules, retention, created_at]
      properties:
        id: { type: integer }
        name: { type: string }
        tag: { type: string, description: Put on every snapshot of the plan; its retention only applies to snapshots with this tag }
        tags: { type: array, items: { type: string }, description: More tags put on its snapshots }
        paths: { $ref: "#/components/schemas/Paths" }
        options: { $ref: "#/components/schemas/PlanOptions" }
        schedules: { type: array, items: { $ref: "#/components/schemas/Schedule" } }
        retention: { oneOf: [{ $ref: "#/components/schemas/Retention" }, { type: "null" }], description: Null when every snapshot is kept }
        created_at: { type: string, format: date-time }
    PlanInput:
      type: object
      required: [name, paths]
      properties:
        name: { type: string, description: Unique in the repository }
        tags: { type: array, items: { type: string }, maxItems: 20 }
        paths: { $ref: "#/components/schemas/Paths" }
        options:
          type: object
          properties:
            compression: { type: string, enum: [auto, off, max], default: auto }
            exclude_larger_than: { type: string, example: 2G }
            one_file_system: { type: boolean }
            exclude_caches: { type: boolean }
            exclude_if_present: { type: array, items: { type: string } }
            limit_upload: { type: integer, minimum: 0 }
            limit_download: { type: integer, minimum: 0 }
        schedules: { type: array, items: { $ref: "#/components/schemas/ScheduleInput" } }
        retention: { oneOf: [{ $ref: "#/components/schemas/Retention" }, { type: "null" }], description: Null keeps every snapshot; a forget schedule needs one }
    Paths:
      type: object
      required: [include, exclude]
      properties:
        include: { type: array, items: { type: string }, description: Absolute paths inside the allowed roots }
        exclude: { type: array, items: { type: string }, description: restic exclude patterns }
    Retention:
      type: object
      properties:
        keep_last: { type: integer, minimum: 0 }
        keep_hourly: { type: integer, minimum: 0 }
        keep_daily: { type: integer, minimum: 0 }
        keep_weekly: { type: integer, minimum: 0 }
        keep_monthly: { type: integer, minimum: 0 }
        keep_yearly: { type: integer, minimum: 0 }
        keep_within: { type: string, example: 1y6m }
        prune: { type: boolean }
    Job:
      type: object
      required: [id, repository_id, plan_id, kind, trigger, status, created_at, started_at, finished_at, summary, params]
      properties:
        id: { type: integer }
        repository_id: { type: integer }
        plan_id: { type: [integer, "null"], description: The plan of a backup or forget job }
        kind: { type: string, enum: [init, backup, forget, prune, check, unlock, restore] }
        trigger: { type: string, enum: [manual, schedule] }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled, interrupted] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        snapshot_id: { type: string }
        summary: { type: object, additionalProperties: true, description: restic's summary for the kind of job }
        error: { type: string }
        exit_code: { type: integer }
        log_excerpt: { type: string, description: Last lines restic wrote to stderr }
        params: { type: object, additionalProperties: true, description: 'For a restore: snapshot_id, target, include' }
    Event:
      type: object
      required: [job_id, repository_id, kind, status]
      properties:
        job_id: { type: integer }
        repository_id: { type: integer }
        plan_id: { type: integer, description: The plan of a backup or forget job }
        kind: { type: string }
        status: { type: string }
        snapshot_id: { type: string }
        error: { type: string }
        progress:
          type: object
          required: [percent_done, files_done, total_files, bytes_done, total_bytes, seconds_remaining]
          properties:
            percent_done: { type: number }
            files_done: { type: integer }
            total_files: { type: integer }
            bytes_done: { type: integer }
            total_bytes: { type: integer }
            seconds_remaining: { type: integer }
            current_files: { type: array, items: { type: string } }
    Entry:
      type: object
      required: [name, path, dir, size, mtime]
      properties:
        name: { type: string }
        path: { type: string }
        dir: { type: boolean }
        size: { type: integer }
        mtime: { type: string, format: date-time }
    Snapshot:
      type: object
      required: [id, short_id, time, paths, hostname]
      properties:
        id: { type: string }
        short_id: { type: string }
        time: { type: string, format: date-time }
        paths: { type: array, items: { type: string } }
        hostname: { type: string }
        tags: { type: array, items: { type: string } }
        summary: { type: object, additionalProperties: true, description: Stored by restic 0.17 and later }
    Node:
      type: object
      required: [name, type, path, size, mtime, permissions]
      properties:
        name: { type: string }
        type: { type: string, enum: [file, dir, symlink] }
        path: { type: string }
        size: { type: integer }
        mtime: { type: string, format: date-time }
        permissions: { type: string }
    FindMatch:
      type: object
      required: [path, type, size, mtime]
      properties:
        path: { type: string }
        type: { type: string }
        size: { type: integer }
        permissions: { type: string }
        mtime: { type: string, format: date-time }
        user: { type: string }
        group: { type: string }
    Stats:
      type: object
      properties:
        total_size: { type: integer }
        total_uncompressed_size: { type: integer }
        compression_ratio: { type: number }
        total_file_count: { type: integer }
        snapshots_count: { type: integer }
