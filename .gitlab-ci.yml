build:docker:
  image: docker:20.10.21
  stage: build
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_DRIVER: overlay2
    DOCKER_BUILDKIT: 1
    TAG: ${CI_COMMIT_SHORT_SHA}
  services:
    - docker:20.10.21-dind

  before_script:
    - apk add make
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - export CI_REGISTRY_IMAGE=${CI_REGISTRY_IMAGE}
    - export TAG=${TAG}
    - export CI=true

  script:
    - make builddocker
    - make pushdocker
  
  after_script:
    - docker logout
  extends:
    - .rule_build_deploy

deploy:nomad:
  stage: deploy
  image: hendrikmaus/nomad-cli:1.2.3
  variables:
    TAG: ${CI_COMMIT_SHORT_SHA}
  script:
    - nomad validate -var ci_registry_image=${CI_REGISTRY_IMAGE}:${TAG} -var ci_deploy_token=${CI_DEPLOY_TOKEN} job.nomad
    - nomad plan -var ci_registry_image=${CI_REGISTRY_IMAGE}:${TAG} -var ci_deploy_token=${CI_DEPLOY_TOKEN} job.nomad || if [ $? -eq 255 ]; then exit 255; else echo "success"; fi
    - nomad run -var ci_registry_image=${CI_REGISTRY_IMAGE}:${TAG} -var ci_deploy_token=${CI_DEPLOY_TOKEN} job.nomad
  extends:
    - .rule_build_deploy
