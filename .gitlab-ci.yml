.rule_build_deploy:
  rules:  
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev" 

.rule_build_release:
  only:
    - main

variables:
  # Package version can only contain numbers (0-9), and dots (.).
  # Must be in the format of X.Y.Z, i.e. should match /\A\d+\.\d+\.\d+\z/ regular expresion.
  # See https://docs.gitlab.com/ee/user/packages/generic_packages/#publish-a-package-file
  PACKAGE_NAME: ${CI_PROJECT_NAME}-${CI_COMMIT_SHORT_SHA}
  PACKAGE_VERSION: 'v0.1.3'
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/release/${PACKAGE_VERSION}"
  GO_VERSION: "1.20.2"
  NODE_VERSION: "18.15.0-alpine"
  UBUNTU_DOCKER_IMAGE: ubuntu:jammy-20230301
  ALPINE_DOCKER_IMAGE: alpine:3.17.2

stages:
  - test
  - download
  - build
  - docker
  - package
  - upload
  - release

sonarqube-check:
  image: 
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
    GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
    SONAR_SCANNER_OPTS: -Djavax.net.ssl.trustStore=/tmp/sonarqube-keystore.jks -Djavax.net.ssl.trustStorePassword=gitlabci
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  before_script:
    - cat $HTTPSCA | keytool -import -noprompt -trustcacerts -alias sonarqube -storepass gitlabci -keystore /tmp/sonarqube-keystore.jks
    - mkdir .scannerwork && chown 1000:1000 .scannerwork
  script: 
    - sonar-scanner
  allow_failure: true
  only:
    - main
    - dev
  needs: [test:go]
  dependencies: 
    - test:go

test:go:
  image: golang:${GO_VERSION}
  stage: test
  script:
    - make testgoci
    - go test ./internal/... -json > test-report.out
  artifacts:
    paths:
      - coverage.out
      - test-report.out

test:go:coverage:
  stage: test
  image: golang:${GO_VERSION}
  script:
    - go test ./internal/... -coverprofile=coverage.txt -covermode count
    - go get github.com/boumenot/gocover-cobertura
    - go run github.com/boumenot/gocover-cobertura < coverage.txt > coverage.xml
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

test:web:
  image: node:${NODE_VERSION}
  variables:
    FF_USE_FASTZIP: "true"
  stage: test
  script:
    - cd front && npm ci && npm run lint

.build:docker:multiarch:
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_DRIVER: overlay2
    DOCKER_BUILD_DIR: .
    FQ_IMAGE_NAME: "${CI_REGISTRY_IMAGE}/resticgui"
  stage: docker
  image: guglio/dind-buildx:latest
  services:
    - docker:20.10.22-dind
  script:
    - echo ${FQ_IMAGE_NAME}:${VERSION}
    - docker run --rm --privileged multiarch/qemu-user-static --reset -p yes;docker context create ctx; docker buildx create ctx --use
    - export BUILDARGS="--build-arg BASEDOCKERIMAGE=${BASE_DOCKER_IMAGE} --build-arg RESTICGUIVERSION=${PACKAGE_VERSION}"
    - docker buildx build -f ${DOCKERFILE} --push --platform linux/arm64/v8,linux/amd64 --tag ${FQ_IMAGE_NAME}:${VERSION} ${DOCKER_BUILD_DIR} ${BUILDARGS}
  after_script:
    - docker logout 
  extends:
    - .rule_build_release

.push:dockerhub:multiarch:
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_DRIVER: overlay2
    DOCKER_BUILD_DIR: .
    FQ_IMAGE_NAME: "${CI_REGISTRY_IMAGE}/resticgui"
    FQ_DOCKERHUB_IMAGE_NAME: "registry-1.docker.io/resticgui/resticgui"
  stage: docker
  image: docker:20.10.22
  services:
    - docker:20.10.22-dind
  script:
    - echo ${FQ_IMAGE_NAME}:${VERSION}
    - echo ${FQ_DOCKERHUB_IMAGE_NAME}:${VERSION}
    - docker pull --platform linux/arm64 ${FQ_IMAGE_NAME}:${VERSION}
    - docker tag ${FQ_IMAGE_NAME}:${VERSION} ${FQ_DOCKERHUB_IMAGE_NAME}:${VERSION}-arm64
    - docker push ${FQ_DOCKERHUB_IMAGE_NAME}:${VERSION}-arm64
    - docker pull --platform linux/amd64 ${FQ_IMAGE_NAME}:${VERSION}
    - docker tag ${FQ_IMAGE_NAME}:${VERSION} ${FQ_DOCKERHUB_IMAGE_NAME}:${VERSION}-amd64
    - docker push ${FQ_DOCKERHUB_IMAGE_NAME}:${VERSION}-amd64
    - docker manifest create ${FQ_DOCKERHUB_IMAGE_NAME}:${VERSION} ${FQ_DOCKERHUB_IMAGE_NAME}:${VERSION}-amd64 ${FQ_DOCKERHUB_IMAGE_NAME}:${VERSION}-arm64
    - docker manifest push --purge ${FQ_DOCKERHUB_IMAGE_NAME}:${VERSION}
  after_script:
    - docker logout 
  extends:
    - .auth:registry:dockerhub
    - .rule_build_release

push:dockerhub:ubuntu:
  extends:
    - .push:dockerhub:multiarch
    - .build:docker:ubuntu
  needs:
    - job: build:docker:gitlab:ubuntu

push:dockerhub:alpine:
  extends:
    - .push:dockerhub:multiarch
    - .build:docker:alpine
  needs:
    - job: build:docker:gitlab:alpine


.auth:registry:
  before_script:
    - echo $CI_REGISTRY
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY

.auth:registry:gitlab:
  variables:
    FQ_IMAGE_NAME: "${CI_REGISTRY_IMAGE}/resticgui"
  extends:
    - .auth:registry

.auth:registry:dockerhub:
  variables:
    FQ_IMAGE_NAME: "${CI_DOCKERHUB}/resticgui/resticgui"
    CI_REGISTRY_PASSWORD: ${CI_DOCKERHUB_PASSWORD}
    CI_REGISTRY_USER: ${CI_DOCKERHUB_USER}
    CI_REGISTRY: ${CI_DOCKERHUB}
  extends:
    - .auth:registry

.build:docker:amd:
  variables:
    PLATFORMS_BUILD: --platform linux/amd64
    ARCH: amd64
  tags:
    - saas-linux-large-amd64
    # - amd
    # - docker
  needs:
    - job: download:restic:amd
      artifacts: true
    - job: download:restic:arm
      artifacts: true
    - job: build:package:go:amd
      artifacts: true
    - job: build:package:go:arm
      artifacts: true
    - job: build:package:web
      artifacts: true

.build:docker:ubuntu:
  variables:
    BASE_DOCKER_IMAGE: ${UBUNTU_DOCKER_IMAGE}
    LAST_VERSION: latest
    VERSION: ${PACKAGE_VERSION}
    DOCKERFILE: release-ubuntu.Dockerfile

.build:docker:alpine:
  variables:
    BASE_DOCKER_IMAGE: ${ALPINE_DOCKER_IMAGE}
    LAST_VERSION: alpine
    VERSION: ${PACKAGE_VERSION}-alpine
    DOCKERFILE: release-alpine.Dockerfile

build:docker:gitlab:ubuntu:
  variables:
    FQ_IMAGE_NAME: "${CI_REGISTRY_IMAGE}/resticgui"
  extends:
    - .auth:registry:gitlab
    - .build:docker:amd
    - .build:docker:ubuntu
    - .build:docker:multiarch

build:docker:gitlab:alpine:
  variables:
    FQ_IMAGE_NAME: "${CI_REGISTRY_IMAGE}/resticgui"
  extends:
    - .auth:registry:gitlab
    - .build:docker:amd
    - .build:docker:alpine
    - .build:docker:multiarch

.build:go:arm:
  variables:
    GOOS: linux
    GOARCH: arm64

.build:go:amd:
  variables:
    GOOS: linux
    GOARCH: amd64

.build:package:go:
  image: golang:${GO_VERSION}
  stage: build
  extends:
    - .rule_build_release
  script:
    - make buildgo
  artifacts:
    paths:
      - dist/

build:package:go:amd:
  extends:
    - .build:package:go
    - .build:go:amd

build:package:go:arm:
  extends:
    - .build:package:go
    - .build:go:arm

build:package:web:
  image: node:${NODE_VERSION}
  variables:
    FF_USE_FASTZIP: "true"
  stage: build
  extends:
    - .rule_build_release
  before_script:
    - apk add make --update
  script:
    - make buildweb
  artifacts:
    paths:
      - dist/build/

.download:restic:
  image: alpine:3.17.0
  stage: download
  extends:
    - .rule_build_release
  before_script:
    - apk add make bzip2 curl --update
  script:
    - make buildrestic
    - mv dist/restic dist/restic-$GOARCH
  artifacts:
    paths:
      - dist/
  needs: []

download:restic:amd:
  variables:
    GOARCH: amd64
  extends:
    - .download:restic

download:restic:arm:
  variables:
    GOARCH: arm64
  extends:
    - .download:restic

.build:package:
  image: busybox:1.34.1
  stage: package
  script:
    - cd dist/ && tar -cvzf ${PACKAGE_NAME}-${ARCH}.tar.gz *
  extends:
    - .rule_build_release
  artifacts:
    paths:
      - dist/${PACKAGE_NAME}-${ARCH}.tar.gz

build:package:arm:
  variables:
    ARCH: arm64
  extends:
    - .build:package
  needs:
    - job: build:package:go:arm
      artifacts: true
    - job: build:package:web
      artifacts: true

build:package:amd:
  variables:
    ARCH: amd64
  extends:
    - .build:package
  needs:
    - job: build:package:go:amd
      artifacts: true
    - job: build:package:web
      artifacts: true

.upload:
  stage: upload
  image: curlimages/curl:latest
  extends:
    - .rule_build_release
  script:
    - |
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file dist/${PACKAGE_NAME}-${ARCH}.tar.gz "${PACKAGE_REGISTRY_URL}/${PACKAGE_NAME}-${ARCH}.tar.gz"

upload:arm:
  extends: [.upload]
  variables:
    ARCH: arm64
  needs:
    - job: build:package:arm
      artifacts: true

upload:amd:
  extends: [.upload]
  variables:
    ARCH: amd64
  needs:
    - job: build:package:amd
      artifacts: true

release_job:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  extends:
    - .rule_build_release
  script:
    - echo "running release_job for $TAG"
  release:                                         # See https://docs.gitlab.com/ee/ci/yaml/#release for available properties
    tag_name: '${PACKAGE_VERSION}'                # The version is incremented per pipeline.
    description: '$CI_PIPELINE_IID'
    ref: '$CI_COMMIT_SHA' 
    assets:
      links:
      - name: '${PACKAGE_NAME}-amd64.tar.gz'
        url: '${PACKAGE_REGISTRY_URL}/${PACKAGE_NAME}-amd64.tar.gz'
      - name: '${PACKAGE_NAME}-arm64.tar.gz'
        url: '${PACKAGE_REGISTRY_URL}/${PACKAGE_NAME}-arm64.tar.gz'
  needs:
    - job: upload:amd
    - job: upload:arm