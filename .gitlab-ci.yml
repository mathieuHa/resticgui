.rule_build_deploy:
  rules:  
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "production" || $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "41-cicd-docker-to-vm"

stages:
  - test
  - build
  - deploy

include:
  - template: Security/SAST.gitlab-ci.yml

testgo:
  variables:
  # Please edit to your GitLab project
    REPO_NAME: gitlab.com/resticgui/resticgui

  # The problem is that to be able to use go get, one needs to put
  # the repository in the $GOPATH. So for example if your gitlab domain
  # is gitlab.com, and that your repository is namespace/project, and
  # the default GOPATH being /go, then you'd need to have your
  # repository in /go/src/gitlab.com/namespace/project
  # Thus, making a symbolic link corrects this.
  before_script:
    - mkdir -p $GOPATH/src/$(dirname $REPO_NAME)
    - ln -svf $CI_PROJECT_DIR $GOPATH/src/$REPO_NAME
    - cd $GOPATH/src/$REPO_NAME

  image: golang:1.16.6
  stage: test
  script:
    - make testgo
    #- go fmt $(go list ./... | grep -v /vendor/)
    #- go vet $(go list ./... | grep -v /vendor/)
    #- go test -race $(go list ./... | grep -v /vendor/)

buildgo:
  variables:
  # Please edit to your GitLab project
    REPO_NAME: gitlab.com/resticgui/resticgui

  # The problem is that to be able to use go get, one needs to put
  # the repository in the $GOPATH. So for example if your gitlab domain
  # is gitlab.com, and that your repository is namespace/project, and
  # the default GOPATH being /go, then you'd need to have your
  # repository in /go/src/gitlab.com/namespace/project
  # Thus, making a symbolic link corrects this.
  before_script:
    - mkdir -p $GOPATH/src/$(dirname $REPO_NAME)
    - ln -svf $CI_PROJECT_DIR $GOPATH/src/$REPO_NAME
    - cd $GOPATH/src/$REPO_NAME
  image: golang:1.16.6
  stage: build
  script:
    - make buildgo
  artifacts:
    paths:
      - dist/
  extends:
    - .rule_build_deploy


buildweb:
  image: trion/ng-cli
  variables:
    FF_USE_FASTZIP: "true"
  stage: build
  script:
    - make buildweb
  tags:
    - docker
    - mhx-srv
  extends:
    - .rule_build_deploy

testweb:
  image: trion/ng-cli-karma
  variables:
    FF_USE_FASTZIP: "true"
  stage: test
  script:
    - make testweb

builddocker:
  variables:
    # using "docker" as the host is only possible if you alias the service below
    DOCKER_HOST: tcp://docker:2375 
    # could be wrong here but although Docker defaults to overlay2, 
    # Docker-in-Docker (DIND) does not according to the following GitLab doc: 
    # https://docs.gitlab.com/ee/ci/docker/using_docker_build.html#use-the-overlayfs-driver
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    TAG: ${CI_COMMIT_BRANCH}

  # Use the official docker image.
  image: docker:19.03.12
  services:
    - name: docker:19.03.12-dind
      alias: docker
      command: ["--tls=false"]
  stage: build
  before_script:
    - apk add make
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - export CI_REGISTRY_IMAGE=${CI_REGISTRY_IMAGE}
    - export TAG=${TAG}
    - export CI=true

  script:
    - make builddocker
    - make pushdocker
  
  after_script:
    - docker logout
  extends:
    - .rule_build_deploy

deploy:
  stage: deploy
  image: ubuntu:20.04
  environment: $CI_COMMIT_BRANCH
  before_script:
    - 'command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - echo "$CI_SSH_PRIVATE_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan ${CI_DEPLOY_IP} >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
    - tag="$CI_COMMIT_BRANCH"
    - export TAG=${tag}
    - export CI_REGISTRY_IMAGE=${CI_REGISTRY_IMAGE}
    - export CI_PROJECT_PATH=${CI_PROJECT_PATH}

  script:
    # create the directory based on the project path
    - ssh -o StrictHostKeyChecking=no ${CI_USER}@${CI_DEPLOY_IP} "mkdir -p ${CI_PROJECT_PATH}"
    
    # clone and/or pull the project in the branch directory
    - ssh -o StrictHostKeyChecking=no ${CI_USER}@${CI_DEPLOY_IP} "cd ${CI_PROJECT_PATH} && git clone -4 https://${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD}@gitlab.com/${CI_PROJECT_PATH} ${TAG} || true"
    - ssh -o StrictHostKeyChecking=no ${CI_USER}@${CI_DEPLOY_IP} "cd ${CI_PROJECT_PATH}/${TAG} && git checkout ${TAG} -f"
    - ssh -o StrictHostKeyChecking=no ${CI_USER}@${CI_DEPLOY_IP} "cd ${CI_PROJECT_PATH}/${TAG} && export TAG=${tag} && git fetch https://${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD}@gitlab.com/${CI_PROJECT_PATH} && git pull -4 https://${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD}@gitlab.com/${CI_PROJECT_PATH} ${TAG}"

    # Copy env files, login to gitlab registry and deploy
    - scp -o StrictHostKeyChecking=no ${ENV} ${CI_USER}@${CI_DEPLOY_IP}:${CI_PROJECT_PATH}/${TAG}/.env
    - ssh -o StrictHostKeyChecking=no ${CI_USER}@${CI_DEPLOY_IP} "docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY"
    - ssh -o StrictHostKeyChecking=no ${CI_USER}@${CI_DEPLOY_IP} "cd ${CI_PROJECT_PATH}/${TAG} && export CI_REGISTRY_IMAGE=${CI_REGISTRY_IMAGE} && export TAG=${tag} && docker-compose config && docker-compose pull && docker-compose up -d"

  extends:
    - .rule_build_deploy